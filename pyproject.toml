[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image_lab"
dynamic = ["version"]
description = "Small desktop app for preprocessing images: drag edges to pad or crop, then export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Background removal (Image > Remove Background). All MIT or BSD licensed.
bg = [
    "onnxruntime-directml>=1.20",
    "numpy>=1.26",
]

[project.gui-scripts]
image-lab = "image_lab.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "image_lab.__version__" }

[tool.setuptools.packages.find]
include = ["image_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: needs a Qt application (runs headless on the offscreen platform)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
